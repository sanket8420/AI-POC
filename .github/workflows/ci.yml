name: Build, Test, and Deploy

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/enterprise-ai-poc

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        run: |
          docker build -t ai-poc-img .

  push-image:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: |
          echo "tag=${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest


  deploy:
    needs: push-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Set image tag
        run: |
          echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/enterprise-ai-poc:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Show image
        run: |
          echo "Pulling image: $IMAGE"

      - name: Pull image
        run: |
          docker pull "$IMAGE"

      - name: Run container
        run: |
          docker run -d \
            --name enterprise-ai-poc \
            -p 8501:8501 \
            "$IMAGE"

      - name: Check container
        run: |
          docker ps
          docker logs enterprise-ai-poc

      
